<!DOCTYPE html>
<html lang="en">
<head>
    <title>Saib's CV</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://googleapis.com">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-color: #1e293b; /* Dark slate */
            --secondary-color: #3b82f6; /* Modern blue */
            --text-main: #334155;
            --text-light: #64748b;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ebeef2;
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .cv-container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .cv-container {
                grid-template-columns: 320px 1fr;
            }
        }

        .sidebar {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 40px 30px;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-img-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid rgba(255, 255, 255, 0.1);
            background-color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-img-container i {
            font-size: 60px;
            color: #cbd5e1;
        }

        .candidate-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .candidate-title {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-heading {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--secondary-color);
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-top: 30px;
        }

        .contact-list {
            list-style: none;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .contact-item i {
            width: 25px;
            color: var(--secondary-color);
            font-size: 16px;
            margin-right: 10px;
            text-align: center;
        }

        .contact-item a {
            color: #cbd5e1;
            text-decoration: none;
            transition: color 0.2s ease, padding-left 0.2s ease;
        }

        .contact-item a:hover {
            color: #ffffff;
            padding-left: 4px;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            transition: background 0.3s ease;
        }

        .skill-tag:hover {
            background: var(--secondary-color);
        }

        .main-content {
            padding: 50px 40px;
            background-color: #ffffff;
        }

        .main-section {
            margin-bottom: 40px;
        }

        .main-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-color);
            position: relative;
            padding-bottom: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100px;
            height: 2px;
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <div class="cv-container" id="resume">
        
        <aside class="sidebar">
            
            <div class="profile-section">
                <div class="profile-img-container">
                    <img src="https://tse4.mm.bing.net/th/id/OIP.f-L2DpYHbaUADumyaWSGZgHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Profile Picture" onerror="this.style.display='none';">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h1 class="candidate-name">Saib Mustafa</h1>
                <p class="candidate-title">Philosopher</p>
            </div>

            <h2 class="sidebar-heading">Contact</h2>
            <ul class="contact-list">
                <li class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <a href="mailto:l260041@lhr.nu.edu.pk">Mail me please</a>
                </li>
                <li class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <a href="tel:+92 0000000">Call me</a>
                </li>
                <li class="contact-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Lhr</span>
                </li>
                <li class="contact-item">
                    <i class="fa-brands fa-linkedin"></i>
                    <a href="linkedin.com" target="_blank">LinkedIn</a>
                </li>
                <li class="contact-item">
                    <i class="fa-brands fa-github"></i>
                    <a href="https://github.com/l260041-hub" target="_blank">Github</a>
                </li>
            </ul>

            <h2 class="sidebar-heading">Skills</h2>
            <div class="skills-container">
                <span class="skill-tag">Debating</span>
                <span class="skill-tag">Coding</span>
                <span class="skill-tag">HTML and CSS</span>
                <span class="skill-tag">Mathematics</span>
                <span class="skill-tag">Critical Thinking</span>
                <span class="skill-tag">somethin else</span>
            </div>
            
        </aside>

        <main class="main-content">
            
            <section class="main-section">
                <h2 class="section-title">About Me</h2>
			<p>I dont like to share personal details</p>
   	<br>
            <section class="main-section">
                <h2 class="section-title">Why you should hire me</h2>
			<p>You need me I dont need you</p>
</body>
</html>
