<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Timetable</title>

  <!-- This line connects the external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Weekly timetable</h1>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>9:00 – 10:00</th>
            <td class="math">Maths</td>
            <td class="english">English</td>
            <td class="science">Science</td>
            <td class="math">Maths</td>
            <td class="art">Art</td>
          </tr>
          <tr>
            <th>10:00 – 11:00</th>
            <td class="english">English</td>
            <td class="science">Science</td>
            <td class="math">Maths</td>
            <td class="history">History</td>
            <td class="english">English</td>
          </tr>
          <tr class="break">
            <th>11:00 – 11:30</th>
            <td colspan="5">Break</td>
          </tr>
          <tr>
            <th>11:30 – 12:30</th>
            <td class="science">Science</td>
            <td class="history">History</td>
            <td class="pe">PE</td>
            <td class="science">Science</td>
            <td class="math">Maths</td>
          </tr>
          <tr>
            <th>12:30 – 1:30</th>
            <td class="art">Art</td>
            <td class="pe">PE</td>
            <td class="english">English</td>
            <td class="art">Art</td>
            <td class="history">History</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
